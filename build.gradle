plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.othr'
version = '0.0.1-SNAPSHOT'
description = 'Boulder / rock climbing tracking and management tool'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.h2database:h2'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Task to install npm dependencies
task npmInstall(type: Exec) {
	description = 'Install npm dependencies'
	group = 'build'
	commandLine = ['npm', 'install']
	inputs.file('package.json')
	outputs.dir('node_modules')
	// Always run if node_modules doesn't exist or package.json changed
}

// Task to build Tailwind CSS
task buildTailwind(type: Exec) {
	description = 'Build Tailwind CSS'
	group = 'build'
	commandLine = ['npm', 'run', 'build:css']
	dependsOn npmInstall
	inputs.file('package.json')
	inputs.file('src/main/resources/static/css/main.css')
	inputs.dir('src/main/resources/templates')
	outputs.file('src/main/resources/static/css/_build.css')
	// Ensure we use the local node_modules
	environment 'PATH', "${projectDir}/node_modules/.bin:${System.getenv('PATH')}"
}

// Make processResources depend on Tailwind CSS build
processResources.dependsOn buildTailwind

// Extend clean task to also remove the generated _build.css file
clean {
	delete 'src/main/resources/static/css/_build.css'
}
