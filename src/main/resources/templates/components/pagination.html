<nav
    th:fragment="pagination(page, baseUrl)"
    th:if="${page.totalPages > 1}"
    class="flex justify-center items-center gap-4"
    role="navigation"
    aria-label="Pagination"
    xmlns:th="http://www.thymeleaf.org"
    th:with="
        gymIdParam=${#request.getParameter('gymId')},
        sectorIdParam=${#request.getParameter('sectorId')},
        gradeIdsParam=${#request.getParameterValues('gradeIds')},
        projectOnlyParam=${#request.getParameter('projectOnly')},
        sortByParam=${#request.getParameter('sortBy')},
        sortDirParam=${#request.getParameter('sortDir')}"
>
    <!-- Previous Button -->
    <button
        class="button button-square"
        th:disabled="${page.first}"
        aria-label="Previous page"
        th:onclick="|window.location.href='@{{baseUrl}(
            baseUrl=${baseUrl},
            page=${page.number},
            gymId=${gymIdParam},
            sectorId=${sectorIdParam},
            gradeIds=${gradeIdsParam},
            projectOnly=${projectOnlyParam},
            sortBy=${sortByParam},
            sortDir=${sortDirParam}
        )}';|"
    >
        <x th:replace="~{components/icons :: chevron-left}"></x>
    </button>

    <!-- Page Numbers -->
    <th:block
        th:with="
            currentPage=${page.number},
            totalPages=${page.totalPages},
            tempStart=${currentPage - 2},
            startPage=${tempStart < 0 ? 0 : (tempStart > totalPages - 5 ? (totalPages - 5 > 0 ? totalPages - 5 : 0) : tempStart)},
            endPage=${startPage + 4 < totalPages - 1 ? startPage + 4 : totalPages - 1}"
    >
        <th:block th:each="pageNum : ${#numbers.sequence(startPage, endPage)}">
            <button
                th:text="${pageNum + 1}"
                th:class="'button button-square' + (${pageNum == currentPage} ? ' primary' : '')"
                th:disabled="${pageNum == currentPage}"
                th:onclick="|window.location.href='@{{baseUrl}(
                    baseUrl=${baseUrl},
                    page=${pageNum + 1},
                    gymId=${gymIdParam},
                    sectorId=${sectorIdParam},
                    gradeIds=${gradeIdsParam},
                    projectOnly=${projectOnlyParam},
                    sortBy=${sortByParam},
                    sortDir=${sortDirParam}
                )}';|"
            >
                1
            </button>
        </th:block>
    </th:block>

    <!-- Next Button -->
    <button
        class="button button-square"
        th:disabled="${page.last}"
        aria-label="Next page"
        th:onclick="|window.location.href='@{{baseUrl}(
            baseUrl=${baseUrl},
            page=${page.number + 2},
            gymId=${gymIdParam},
            sectorId=${sectorIdParam},
            gradeIds=${gradeIdsParam},
            projectOnly=${projectOnlyParam},
            sortBy=${sortByParam},
            sortDir=${sortDirParam}
        )}';|"
    >
        <x th:replace="~{components/icons :: chevron-right}"></x>
    </button>
</nav>
