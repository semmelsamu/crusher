<nav
    th:fragment="breadcrumb(items)"
    aria-label="Breadcrumb"
    class="py-2 text-foreground-muted"
    xmlns:th="http://www.thymeleaf.org"
>
    <ol class="flex items-center gap-2 flex-wrap">
        <li th:each="item, iterStat : ${items}" class="flex items-center gap-2">
            <a
                th:if="${!iterStat.last}"
                th:href="${item.url}"
                th:text="${item.label}"
                class="hover:underline"
            >
                Label
            </a>
            <span
                th:if="${iterStat.last}"
                th:text="${item.label}"
                class="breadcrumb-current"
                aria-current="page"
            >
                Current Page
            </span>
            <span
                th:if="${!iterStat.last}"
                class="breadcrumb-separator"
                aria-hidden="true"
            >
                <x th:replace="~{components/icons :: chevron-right}"></x>
            </span>
        </li>
    </ol>
</nav>
