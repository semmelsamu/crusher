<form
    th:fragment="boulder(actionUrl, boulder, gym, sector, availableColors, availableGrades)"
    th:action="${actionUrl}"
    th:object="${boulder}"
    method="post"
    class="space-y-4"
    xmlns:th="http://www.thymeleaf.org"
>
    <input
        type="hidden"
        name="_method"
        th:value="${boulder.id} != null ? 'put' : 'post'"
    />

    <div class="space-y-2">
        <label class="block">Description</label>
        <input
            th:field="*{description}"
            class="text-input w-full"
            placeholder="e.g., Links hinten"
        />
        <p
            th:if="${#fields.hasErrors('description')}"
            th:errors="*{description}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Color</label>
        <select th:field="*{color}" class="text-input w-full">
            <option
                th:each="colorOption : ${availableColors}"
                th:value="${colorOption}"
                th:text="${colorOption.displayName}"
            >
                Color
            </option>
        </select>
        <p
            th:if="${#fields.hasErrors('color')}"
            th:errors="*{color}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Grade</label>
        <select th:field="*{grade.id}" class="text-input w-full">
            <option
                th:each="gradeOption : ${availableGrades}"
                th:value="${gradeOption.id}"
                th:text="${gradeOption.name}"
            >
                Grade
            </option>
        </select>
        <p
            th:if="${#fields.hasErrors('grade')}"
            th:errors="*{grade}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="flex justify-end mt-8">
        <button type="submit" class="button button-primary">Save</button>
        <a
            th:if="${boulder.id != null}"
            th:href="@{/admin/gyms/{gymId}/sectors/{sectorId}(gymId=${gym.id}, sectorId=${sector.id})}"
            class="button ml-3"
        >
            Cancel
        </a>
    </div>
</form>
