<form
    th:fragment="grade(actionUrl, grade, gym)"
    th:action="${actionUrl}"
    th:object="${grade}"
    method="post"
    class="space-y-4"
    xmlns:th="http://www.thymeleaf.org"
>
    <input
        type="hidden"
        name="_method"
        th:value="${grade.id} != null ? 'put' : 'post'"
    />

    <div class="space-y-2">
        <label class="block">Name</label>
        <input th:field="*{name}" class="text-input w-full" />
        <p
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            class="text-red-600 text-sm mt-1"
        ></p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
            <label class="block">V-Scale</label>
            <input th:field="*{vScale}" class="text-input w-full" />
            <p
                th:if="${#fields.hasErrors('vScale')}"
                th:errors="*{vScale}"
                class="text-red-600 text-sm mt-1"
            ></p>
        </div>
        <div class="space-y-2">
            <label class="block">Font-Scale</label>
            <input th:field="*{fontScale}" class="text-input w-full" />
            <p
                th:if="${#fields.hasErrors('fontScale')}"
                th:errors="*{fontScale}"
                class="text-red-600 text-sm mt-1"
            ></p>
        </div>
    </div>

    <div class="space-y-2">
        <label class="block">Description</label>
        <textarea
            th:field="*{description}"
            class="text-input w-full"
            rows="4"
        ></textarea>
    </div>

    <div class="flex justify-end mt-8">
        <button type="submit" class="button button-primary">Save</button>
    </div>
</form>
