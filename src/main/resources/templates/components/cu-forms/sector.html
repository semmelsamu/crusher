<form
    th:fragment="sector(actionUrl, sector, gym)"
    th:action="${actionUrl}"
    th:object="${sector}"
    method="post"
    enctype="multipart/form-data"
    class="space-y-4"
    xmlns:th="http://www.thymeleaf.org"
>
    <input
        type="hidden"
        name="_method"
        th:value="${sector.id} != null ? 'put' : 'post'"
    />

    <div class="space-y-2">
        <label class="block">Name</label>
        <input th:field="*{name}" class="text-input w-full" />
        <p
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Description</label>
        <textarea
            th:field="*{description}"
            class="text-input w-full"
            rows="4"
        ></textarea>
    </div>

    <section
        class="space-y-3"
        data-image-picker
        th:with="hasImage=${sector.imagePath != null and !#strings.contains(sector.imagePath, 'default-sector')}"
        th:attr="data-has-image=${hasImage}, data-original-src=${hasImage} ? ${sector.imagePath} : ''"
    >
        <div class="space-y-2">
            <p class="font-medium">Image</p>
            <p class="text-sm text-foreground-muted">
                JPG, PNG, WEBP, or GIF — max 5MB
            </p>
        </div>

        <div class="flex items-center gap-3">
            <input
                type="file"
                name="imageFile"
                accept="image/*"
                data-image-input
                class="text-input w-full"
            />
            <input
                type="hidden"
                name="removeImage"
                value="false"
                data-remove-input
            />
            <button
                type="button"
                class="button button-primary whitespace-nowrap"
                data-remove-button
                th:disabled="${!hasImage}"
            >
                <x th:replace="~{components/icons :: trash-2}"></x>
                <span
                    th:text="${hasImage} ? 'Remove image' : 'No image to remove'"
                >
                    Remove image
                </span>
            </button>
        </div>

        <div class="image-picker-frame aspect-video w-full">
            <img
                data-preview-image
                th:attr="src=${hasImage} ? ${sector.imagePath} : ''"
                th:classappend="${!hasImage} ? 'hidden' : ''"
                alt="Sector image preview"
                class="image-picker-img"
            />
            <div
                data-placeholder
                th:classappend="${hasImage} ? 'hidden' : ''"
                class="image-picker-placeholder"
            >
                <x th:replace="~{components/icons :: image-off}"></x>
                <p class="font-medium">Image coming soon</p>
            </div>
        </div>
    </section>

    <button type="submit" class="button button-primary mt-8 ml-auto">
        Save
    </button>
</form>
