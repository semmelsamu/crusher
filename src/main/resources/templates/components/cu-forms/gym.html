<form
    th:fragment="gym(actionUrl, gym)"
    th:action="${actionUrl}"
    th:object="${gym}"
    method="post"
    class="space-y-4"
    xmlns:th="http://www.thymeleaf.org"
>
    <input
        type="hidden"
        name="_method"
        th:value="${gym.id} != null ? 'put' : 'post'"
    />

    <div class="space-y-2">
        <label class="block">Name</label>
        <input th:field="*{name}" class="text-input w-full" />
        <p
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Street</label>
        <input th:field="*{street}" class="text-input w-full" />
        <p
            th:if="${#fields.hasErrors('street')}"
            th:errors="*{street}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">City</label>
        <input th:field="*{city}" class="text-input w-full" />
        <p
            th:if="${#fields.hasErrors('city')}"
            th:errors="*{city}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Email</label>
        <input th:field="*{email}" type="email" class="text-input w-full" />
        <p
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <button type="submit" class="button button-primary mt-8 ml-auto">
        Save
    </button>
</form>
