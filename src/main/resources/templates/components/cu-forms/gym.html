<form
    th:fragment="gym(actionUrl, gym)"
    th:action="${actionUrl}"
    th:object="${gym}"
    method="post"
    class="space-y-6"
    xmlns:th="http://www.thymeleaf.org"
    th:x-data="'{ showMap: ' + ${gym.latitude != null && gym.longitude != null} + ' }'"
>
    <input
        type="hidden"
        name="_method"
        th:value="${gym.id} != null ? 'put' : 'post'"
    />

    <div class="space-y-2">
        <label class="block">Name</label>
        <input th:field="*{name}" class="text-input w-full" required />
        <p
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Street</label>
        <input th:field="*{street}" class="text-input w-full" required />
        <p
            th:if="${#fields.hasErrors('street')}"
            th:errors="*{street}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">City</label>
        <input th:field="*{city}" class="text-input w-full" required />
        <p
            th:if="${#fields.hasErrors('city')}"
            th:errors="*{city}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Email</label>
        <input
            th:field="*{email}"
            type="email"
            class="text-input w-full"
            required
        />
        <p
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-4">
        <div class="flex items-center gap-4">
            <label class="switch">
                <input type="checkbox" id="map-toggle" x-model="showMap" />
                <span class="switch-thumb"></span>
            </label>
            <label for="map-toggle">Set location on map</label>
        </div>

        <input type="hidden" th:field="*{latitude}" data-lat-input />
        <input type="hidden" th:field="*{longitude}" data-lng-input />

        <div
            id="gym-form-map"
            x-show="showMap"
            x-cloak
            class="rounded-lg border border-border overflow-hidden"
            style="height: 400px"
            data-map-container
        ></div>

        <div class="space-y-1">
            <p
                th:if="${#fields.hasErrors('latitude')}"
                th:errors="*{latitude}"
                class="text-error text-sm"
            ></p>
            <p
                th:if="${#fields.hasErrors('longitude')}"
                th:errors="*{longitude}"
                class="text-error text-sm"
            ></p>
        </div>
    </div>

    <div class="space-y-2">
        <label class="block">Crowd Level URL</label>
        <input
            th:field="*{crowdLevelUrl}"
            type="url"
            class="text-input w-full"
        />
        <p class="text-foreground-muted text-sm">
            URL to the crowd level display of the hall (if available)
        </p>
        <p
            th:if="${#fields.hasErrors('crowdLevelUrl')}"
            th:errors="*{crowdLevelUrl}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <button type="submit" class="button primary mt-8 ml-auto">Save</button>
</form>
