<form
    th:fragment="gym(actionUrl, gym)"
    th:action="${actionUrl}"
    th:object="${gym}"
    method="post"
    class="space-y-4"
    xmlns:th="http://www.thymeleaf.org"
>
    <input
        type="hidden"
        name="_method"
        th:value="${gym.id} != null ? 'put' : 'post'"
    />

    <div class="space-y-2">
        <label class="block">Name</label>
        <input th:field="*{name}" class="text-input w-full" required />
        <p
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Street</label>
        <input th:field="*{street}" class="text-input w-full" required />
        <p
            th:if="${#fields.hasErrors('street')}"
            th:errors="*{street}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">City</label>
        <input th:field="*{city}" class="text-input w-full" required />
        <p
            th:if="${#fields.hasErrors('city')}"
            th:errors="*{city}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="space-y-2">
        <label class="block">Email</label>
        <input
            th:field="*{email}"
            type="email"
            class="text-input w-full"
            required
        />
        <p
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
            <label class="block">Latitude (optional)</label>
            <input
                th:field="*{latitude}"
                type="number"
                step="any"
                class="text-input w-full"
                placeholder="49.032275"
            />
            <p
                th:if="${#fields.hasErrors('latitude')}"
                th:errors="*{latitude}"
                class="text-error text-sm mt-1"
            ></p>
        </div>

        <div class="space-y-2">
            <label class="block">Longitude (optional)</label>
            <input
                th:field="*{longitude}"
                type="number"
                step="any"
                class="text-input w-full"
                placeholder="12.128859"
            />
            <p
                th:if="${#fields.hasErrors('longitude')}"
                th:errors="*{longitude}"
                class="text-error text-sm mt-1"
            ></p>
        </div>
    </div>

    <div class="space-y-2">
        <label class="block">Crowd Level URL (optional)</label>
        <input
            th:field="*{crowdLevelUrl}"
            type="url"
            class="text-input w-full"
            placeholder="https://www.boulderwelt-regensburg.de/"
        />
        <p class="text-foreground-muted text-sm">
            URL zur Live-Auslastungsanzeige der Halle (falls verfügbar)
        </p>
        <p
            th:if="${#fields.hasErrors('crowdLevelUrl')}"
            th:errors="*{crowdLevelUrl}"
            class="text-error text-sm mt-1"
        ></p>
    </div>

    <button type="submit" class="button primary mt-8 ml-auto">Save</button>
</form>
