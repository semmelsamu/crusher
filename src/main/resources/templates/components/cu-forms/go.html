<form
    th:fragment="go(actionUrl, go, boulder, showCreateAnother, createAnother)"
    th:action="${actionUrl}"
    th:object="${go}"
    method="post"
    class="space-y-4"
    xmlns:th="http://www.thymeleaf.org"
>
    <input type="hidden" name="_method" value="put" th:if="${go.id != null}" />
    <input type="hidden" th:field="*{boulder.id}" />
    <input type="hidden" th:field="*{session.id}" />

    <h2>Record Go</h2>

    <div
        class="p-4 border-2 rounded-base flex items-center gap-4 bg-background"
    >
        <div th:class="'color-badge ' + ${boulder.color.cssColorClass}"></div>
        <span class="grade-badge" th:text="${boulder.grade.name}"> Grade </span>
        <p th:text="${boulder.description}">Boulder</p>
    </div>

    <div class="space-y-2">
        <p>Select Result</p>

        <div class="grid grid-cols-3 gap-4">
            <label class="cursor-pointer h-full">
                <input
                    type="radio"
                    th:field="*{result}"
                    value="DID_NOT_FINISH"
                    class="peer sr-only"
                    required
                />
                <div
                    class="button danger h-16 peer-checked:border-pressed peer-checked:font-bold leading-tight"
                >
                    Did not finish
                </div>
            </label>

            <label class="cursor-pointer h-full">
                <input
                    type="radio"
                    th:field="*{result}"
                    value="CLOSE_TRY"
                    class="peer sr-only"
                    required
                />
                <div
                    class="button warning h-16 peer-checked:border-pressed peer-checked:font-bold"
                >
                    Close try
                </div>
            </label>

            <label class="cursor-pointer h-full">
                <input
                    type="radio"
                    th:field="*{result}"
                    value="FINISHED"
                    class="peer sr-only"
                    required
                />
                <div
                    class="button success h-16 peer-checked:border-pressed peer-checked:font-bold"
                >
                    Finished
                </div>
            </label>
        </div>
    </div>

    <div th:if="${#fields.hasErrors('result')}" class="text-error text-sm">
        <p th:errors="*{result}">Error</p>
    </div>

    <div
        class="grid grid-cols-[auto_1fr] items-center gap-4 my-8"
        th:if="${boulder.holdsCount != null}"
    >
        <input
            type="checkbox"
            name="trackProgress"
            value="true"
            class="checkbox peer"
            th:checked="${go.progressedHold != null}"
            id="track-progress"
        />
        <div>
            <label for="track-progress">
                <span>Track detailed progress</span>
                <br />
                <span class="text-foreground-muted">
                    Record the highest hold you reached
                </span>
            </label>
        </div>

        <div
            class="col-start-2 space-y-4 border-2 rounded-base p-4 hidden peer-checked:block bg-background"
            th:attr="data-disabled=${go.progressedHold == null}"
            th:x-data="'{ hold: ' + ${go.progressedHold != null ? go.progressedHold : 0} + '}'"
        >
            <div class="flex items-center justify-between">
                <label for="reached-hold">Reached hold</label>
                <span>
                    <span x-text="hold">0</span>
                    /
                    <span
                        th:text="${boulder.holdsCount}"
                        class="text-muted-foreground"
                    >
                        0
                    </span>
                </span>
            </div>

            <x
                th:replace="~{components/slider :: slider(
                    min='0',
                    max=${boulder.holdsCount},
                    step='1',
                    name='progressedHold',
                    value=*{progressedHold},
                    cssClass='w-full',
                    xModel='hold',
                    inputId='reached-hold'
                )}"
            ></x>
            <div
                th:if="${#fields.hasErrors('progressedHold')}"
                class="text-error text-sm"
            >
                <p th:errors="*{progressedHold}">Error</p>
            </div>
        </div>
    </div>

    <div class="flex items-center justify-between mt-6">
        <div
            th:if="${showCreateAnother}"
            class="flex items-center gap-4 cursor-pointer"
        >
            <label class="switch">
                <input
                    type="checkbox"
                    name="createAnother"
                    value="true"
                    id="create-more-goes"
                    th:checked="${createAnother}"
                />
                <span class="switch-thumb"></span>
            </label>
            <label for="create-more-goes">Create more Goes</label>
        </div>

        <button type="submit" class="button success ml-auto">
            <x th:replace="~{components/icons :: check}"></x>
            Save
        </button>
    </div>
</form>
