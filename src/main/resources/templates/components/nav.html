<nav
    th:fragment="nav"
    class="border-b-4 bg-secondary-background h-20 overflow-hidden data-[open=true]:h-screen fixed top-0 left-0 right-0 z-50"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
    id="main-nav"
    data-open="false"
>
    <div
        class="container h-full mx-auto px-4 md:flex items-center justify-between"
    >
        <div class="h-20 flex items-center justify-between">
            <a href="/">
                <img
                    src="/images/wordmark.svg"
                    alt="crusher"
                    class="h-4 nav-logo"
                />
            </a>

            <button
                class="button button-ghost button-square md:hidden"
                onclick="
                    document.getElementById('main-nav').dataset.open =
                        document.getElementById('main-nav').dataset.open ===
                        'true'
                            ? 'false'
                            : 'true'
                "
            >
                <x th:replace="~{components/icons :: menu}"></x>
            </button>
        </div>

        <div class="flex flex-col md:flex-row items-start gap-4">
            <div
                class="flex flex-col md:flex-row items-start md:items-center gap-4"
                sec:authorize="isAuthenticated()"
            >
                <a
                    href="/admin/gyms"
                    class="button button-ghost"
                    sec:authorize="hasAnyRole('ADMIN', 'OWNER')"
                >
                    <x
                        th:replace="~{components/icons :: sliders-horizontal}"
                    ></x>
                    Admin Panel
                </a>

                <a
                    href="/dashboard"
                    class="button button-ghost"
                    sec:authorize="isAuthenticated()"
                >
                    <x th:replace="~{components/icons :: layout-dashboard}"></x>
                    Dashboard
                </a>

                <button
                    type="button"
                    class="avatar-button"
                    aria-haspopup="dialog"
                    aria-controls="account-dialog"
                    title="Account settings"
                    onclick="openDialog('account-dialog')"
                >
                    <div
                        th:replace="~{components/avatar :: avatar(${#authentication.principal.username})}"
                    ></div>
                </button>

                <dialog
                    id="account-dialog"
                    class="dialog space-y-4"
                    closedby="any"
                >
                    <div class="flex items-start justify-between gap-4">
                        <div>
                            <h3>Account settings</h3>
                            <p class="text-sm text-foreground-muted">
                                Update your details or delete your account.
                            </p>
                        </div>
                        <button
                            type="button"
                            class="button button-ghost button-square"
                            aria-label="Close"
                            onclick="closeDialog('account-dialog')"
                        >
                            <x th:replace="~{components/icons :: x}"></x>
                        </button>
                    </div>

                    <form
                        th:action="@{/account}"
                        method="post"
                        class="space-y-4"
                        th:if="${currentUser != null}"
                    >
                        <input type="hidden" name="_method" value="put" />
                        <div class="space-y-2">
                            <label for="account-username" class="form-label"
                                >Username</label
                            >
                            <input
                                type="text"
                                id="account-username"
                                name="username"
                                class="text-input block w-full"
                                required
                                th:value="${currentUser.name}"
                            />
                        </div>
                        <div class="space-y-2">
                            <label for="account-email" class="form-label"
                                >Email</label
                            >
                            <input
                                type="email"
                                id="account-email"
                                name="email"
                                class="text-input block w-full"
                                required
                                th:value="${currentUser.email}"
                            />
                        </div>
                        <div class="space-y-2">
                            <label for="account-password" class="form-label"
                                >New password</label
                            >
                            <input
                                type="password"
                                id="account-password"
                                name="password"
                                class="text-input block w-full"
                                autocomplete="new-password"
                                placeholder="Leave blank to keep current"
                            />
                        </div>
                        <div class="space-y-2">
                            <label
                                for="account-confirm-password"
                                class="form-label"
                                >Confirm password</label
                            >
                            <input
                                type="password"
                                id="account-confirm-password"
                                name="confirmPassword"
                                class="text-input block w-full"
                                autocomplete="new-password"
                                placeholder="Re-enter new password"
                            />
                        </div>
                        <button type="submit" class="button primary w-full">
                            <x th:replace="~{components/icons :: check}"></x>
                            Save changes
                        </button>
                    </form>

                    <div class="border-t-2 pt-4 space-y-3">
                        <p class="text-sm text-foreground-muted">
                            Deleting your account removes access but keeps your
                            activity for gym history.
                        </p>
                        <button
                            type="button"
                            class="button danger w-full"
                            onclick="
                                closeDialog('account-dialog');
                                openDialog('delete-account-dialog');
                            "
                        >
                            <x th:replace="~{components/icons :: trash-2}"></x>
                            Delete account
                        </button>
                    </div>
                </dialog>

                <dialog
                    id="delete-account-dialog"
                    class="dialog space-y-4"
                    closedby="any"
                >
                    <h3>Confirm deletion</h3>
                    <p>
                        Are you sure you want to delete your account? Your gym
                        activity will remain.
                    </p>
                    <div class="flex justify-end gap-4">
                        <button
                            class="button"
                            onclick="closeDialog('delete-account-dialog')"
                        >
                            Cancel
                        </button>
                        <form
                            th:action="@{/account}"
                            method="post"
                            class="inline"
                        >
                            <input
                                type="hidden"
                                name="_method"
                                value="delete"
                            />
                            <button
                                autofocus
                                type="submit"
                                class="button danger"
                            >
                                Delete
                            </button>
                        </form>
                    </div>
                </dialog>

                <form
                    th:action="@{/logout}"
                    method="post"
                    class="inline"
                    sec:authorize="isAuthenticated()"
                >
                    <button
                        type="submit"
                        class="button button-ghost button-square"
                    >
                        <x th:replace="~{components/icons :: log-out}"></x>
                    </button>
                </form>
            </div>

            <div
                class="flex flex-col md:flex-row items-start md:items-center gap-4"
                sec:authorize="!isAuthenticated()"
            >
                <p>You are not logged in.</p>
                <a href="/login" class="button button-ghost">
                    Login
                    <x th:replace="~{components/icons :: log-in}"></x>
                </a>
            </div>

            <button
                type="button"
                class="button button-ghost button-square theme-toggle"
                data-theme-toggle
                aria-pressed="false"
                aria-label="Toggle dark mode"
                title="Toggle dark mode"
            >
                <span class="theme-icon theme-icon-sun">
                    <x th:replace="~{components/icons :: sun-small}"></x>
                </span>
                <span class="theme-icon theme-icon-moon">
                    <x th:replace="~{components/icons :: moon}"></x>
                </span>
            </button>
        </div>
    </div>
</nav>
