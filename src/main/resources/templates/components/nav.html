<nav
    th:fragment="nav"
    class="border-b-4 bg-secondary-background h-20 overflow-hidden data-[open=true]:h-screen fixed top-0 left-0 right-0 z-50"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
    id="main-nav"
    data-open="false"
>
    <div
        class="container h-full mx-auto px-4 md:flex items-center justify-between"
    >
        <div class="h-20 flex items-center justify-between">
            <a href="/">
                <img
                    src="/images/wordmark.svg"
                    alt="crusher"
                    class="h-4 nav-logo"
                />
            </a>

            <button
                class="button button-ghost button-square md:hidden"
                onclick="
                    document.getElementById('main-nav').dataset.open =
                        document.getElementById('main-nav').dataset.open ===
                        'true'
                            ? 'false'
                            : 'true'
                "
            >
                <x th:replace="~{components/icons :: menu}"></x>
            </button>
        </div>

        <div class="flex flex-col md:flex-row items-start gap-4">
            <div
                class="flex flex-col md:flex-row items-start md:items-center gap-4"
                sec:authorize="isAuthenticated()"
            >
                <a
                    href="/admin/gyms"
                    class="button button-ghost"
                    sec:authorize="hasAnyRole('ADMIN', 'OWNER', 'SETTER')"
                >
                    <x
                        th:replace="~{components/icons :: sliders-horizontal}"
                    ></x>
                    Admin Panel
                </a>

                <a
                    href="/dashboard"
                    class="button button-ghost"
                    sec:authorize="isAuthenticated()"
                >
                    <x th:replace="~{components/icons :: layout-dashboard}"></x>
                    Dashboard
                </a>

                <a
                    href="/account"
                    aria-label="Account settings"
                    title="Account settings"
                >
                    <div
                        th:replace="~{components/avatar :: avatar(${#authentication.principal.username})}"
                    ></div>
                </a>

                <form
                    th:action="@{/logout}"
                    method="post"
                    class="inline"
                    sec:authorize="isAuthenticated()"
                >
                    <button
                        type="submit"
                        class="button button-ghost button-square"
                    >
                        <x th:replace="~{components/icons :: log-out}"></x>
                    </button>
                </form>
            </div>

            <div
                class="flex flex-col md:flex-row items-start md:items-center gap-4"
                sec:authorize="!isAuthenticated()"
            >
                <p>You are not logged in.</p>
                <a href="/login" class="button button-ghost">
                    Login
                    <x th:replace="~{components/icons :: log-in}"></x>
                </a>
            </div>

            <button
                type="button"
                class="button button-ghost button-square theme-toggle"
                data-theme-toggle
                aria-pressed="false"
                aria-label="Toggle dark mode"
                title="Toggle dark mode"
            >
                <span class="theme-icon theme-icon-sun">
                    <x th:replace="~{components/icons :: sun-small}"></x>
                </span>
                <span class="theme-icon theme-icon-moon">
                    <x th:replace="~{components/icons :: moon}"></x>
                </span>
            </button>
        </div>
    </div>
</nav>
