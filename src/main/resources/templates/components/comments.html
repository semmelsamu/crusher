<section
    th:fragment="comments(actionUrl, comments, deleteUrlBase)"
    class="space-y-4"
    xmlns:th="http://www.thymeleaf.org"
>
    <h2>Comments</h2>

    <form
        th:action="@{${actionUrl}}"
        method="post"
        class="comment-form w-full space-y-4"
        x-data="{ comment: '' }"
    >
        <div class="flex gap-3">
            <div
                th:replace="~{components/avatar :: avatar(${#authentication.principal.username})}"
                class="self-start mt-3"
            ></div>
            <textarea
                id="comment"
                name="comment"
                rows="3"
                class="text-input w-full"
                placeholder="Add a comment"
                required
                x-model="comment"
            ></textarea>
        </div>
        <button
            type="submit"
            class="button ms-auto"
            x-bind:disabled="comment.length === 0"
        >
            Comment
        </button>
    </form>

    <div
        th:if="${comments == null || comments.isEmpty()}"
        class="text-sm text-muted-foreground text-center py-8"
    >
        No comments yet. Be the first to comment!
    </div>

    <div
        th:unless="${comments == null || comments.isEmpty()}"
        class="space-y-6"
    >
        <div th:each="comment : ${comments}" class="flex gap-4">
            <div
                th:replace="~{components/avatar :: avatar(${comment.user.name})}"
            ></div>
            <div class="flex-1">
                <p class="text-sm flex items-center gap-2">
                    <strong th:text="${comment.user.name}"> Username </strong>
                    <time
                        class="text-foreground-muted"
                        th:text="${#temporals.format(comment.createdAt, 'dd.MM.yyyy HH:mm')}"
                    >
                        01.01.2024 12:00
                    </time>
                    <span
                        th:if="${comment.updatedAt != null}"
                        class="text-foreground-muted"
                    >
                        (edited)
                    </span>
                    <span
                        th:if="${comment.user.name == #authentication.principal.username}"
                        th:onclick="|openDialog('edit-comment-dialog-${comment.id}')|"
                        style="
                            cursor: pointer;
                            color: var(--color-foreground-muted);
                            transition: color 0.2s;
                            display: inline-flex;
                            align-items: center;
                            width: 12px;
                            height: 12px;
                        "
                        onmouseover="this.style.color = 'var(--color-primary)'"
                        onmouseout="
                            this.style.color = 'var(--color-foreground-muted)'
                        "
                    >
                        <x th:replace="~{components/icons :: pencil-small}"></x>
                    </span>
                    <span
                        th:if="${comment.user.name == #authentication.principal.username}"
                        th:onclick="|openDialog('delete-comment-dialog-${comment.id}')|"
                        style="
                            cursor: pointer;
                            color: var(--color-foreground-muted);
                            transition: color 0.2s;
                            display: inline-flex;
                            align-items: center;
                            width: 12px;
                            height: 12px;
                        "
                        onmouseover="this.style.color = 'var(--color-error)'"
                        onmouseout="
                            this.style.color = 'var(--color-foreground-muted)'
                        "
                    >
                        <x
                            th:replace="~{components/icons :: trash-2-small}"
                        ></x>
                    </span>
                </p>
                <p th:text="${comment.comment}">Comment text goes here</p>
            </div>

            <!-- Edit comment dialog -->
            <dialog
                th:if="${comment.user.name == #authentication.principal.username}"
                th:id="|edit-comment-dialog-${comment.id}|"
                class="dialog space-y-4"
                closedby="any"
            >
                <h3>Edit Comment</h3>
                <form
                    th:action="${deleteUrlBase + '/' + comment.id}"
                    method="post"
                    class="space-y-4"
                >
                    <input type="hidden" name="_method" value="put" />
                    <textarea
                        name="comment"
                        rows="4"
                        class="text-input w-full"
                        required
                        th:text="${comment.comment}"
                    ></textarea>
                    <div class="flex justify-end gap-4">
                        <button
                            type="button"
                            class="button"
                            th:onclick="|closeDialog('edit-comment-dialog-${comment.id}')|"
                        >
                            Cancel
                        </button>
                        <button autofocus type="submit" class="button primary">
                            Save
                        </button>
                    </div>
                </form>
            </dialog>

            <!-- Delete confirmation dialog -->
            <dialog
                th:if="${comment.user.name == #authentication.principal.username}"
                th:id="|delete-comment-dialog-${comment.id}|"
                class="dialog space-y-4"
                closedby="any"
            >
                <h3>Confirm Deletion</h3>
                <p>Are you sure you want to delete this comment?</p>
                <div class="flex justify-end gap-4">
                    <button
                        class="button"
                        th:onclick="|closeDialog('delete-comment-dialog-${comment.id}')|"
                    >
                        Cancel
                    </button>
                    <form
                        th:action="${deleteUrlBase + '/' + comment.id}"
                        method="post"
                        class="inline"
                    >
                        <input type="hidden" name="_method" value="delete" />
                        <button autofocus type="submit" class="button danger">
                            Delete
                        </button>
                    </form>
                </div>
            </dialog>
        </div>
    </div>
</section>
