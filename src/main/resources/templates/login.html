<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Crusher</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, "Helvetica Neue", Arial, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .login-container {
                background: white;
                padding: 40px;
                border-radius: 16px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                width: 100%;
                max-width: 400px;
            }

            .login-header {
                text-align: center;
                margin-bottom: 30px;
            }

            .login-header h1 {
                color: #333;
                font-size: 28px;
                margin-bottom: 8px;
            }

            .login-header p {
                color: #666;
                font-size: 14px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                color: #333;
                font-weight: 500;
                font-size: 14px;
            }

            input[type="text"],
            input[type="password"] {
                width: 100%;
                padding: 12px 16px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 14px;
                transition: border-color 0.3s;
            }

            input[type="text"]:focus,
            input[type="password"]:focus {
                outline: none;
                border-color: #667eea;
            }

            .btn-login {
                width: 100%;
                padding: 12px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.2s, box-shadow 0.2s;
            }

            .btn-login:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            }

            .btn-login:active {
                transform: translateY(0);
            }

            .error-message {
                background: #fee;
                color: #c33;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                font-size: 14px;
                border-left: 4px solid #c33;
            }

            .logout-message {
                background: #efe;
                color: #3a3;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                font-size: 14px;
                border-left: 4px solid #3a3;
            }

            .login-footer {
                margin-top: 20px;
                text-align: center;
                font-size: 12px;
                color: #999;
            }

            .test-accounts {
                margin-top: 20px;
                padding: 16px;
                background: #f5f5f5;
                border-radius: 8px;
                font-size: 12px;
            }

            .test-accounts h3 {
                margin-bottom: 8px;
                font-size: 13px;
                color: #666;
            }

            .test-accounts ul {
                list-style: none;
            }

            .test-accounts li {
                padding: 4px 0;
                color: #888;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="login-header">
                <h1>🧗 Crusher</h1>
                <p>Track your climbing progress</p>
            </div>

            <div th:if="${param.error}" class="error-message">
                Invalid username or password
            </div>

            <div th:if="${param.logout}" class="logout-message">
                You have been logged out successfully
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autofocus
                        placeholder="Enter your username"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Enter your password"
                    />
                </div>

                <button type="submit" class="btn-login">Log In</button>
            </form>

            <div class="test-accounts">
                <h3>Test Accounts (all use password: test)</h3>
                <ul>
                    <li>👤 alice (USER)</li>
                    <li>⚙️ bob (SETTER)</li>
                    <li>🏢 klaus (OWNER)</li>
                    <li>👑 crusher (ADMIN)</li>
                </ul>
            </div>

            <div class="login-footer">&copy; 2025 Crusher - Climb Higher</div>
        </div>
    </body>
</html>
