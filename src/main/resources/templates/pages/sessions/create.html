<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="wrapper">
            <div
                th:replace="~{components/breadcrumb :: breadcrumb(${breadcrumb})}"
            ></div>

            <div class="flex items-center gap-4">
                <a th:href="@{/dashboard}" class="button button-square">
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 p-4 flex items-center justify-between"
                >
                    <h1>Start a new Session</h1>
                </header>
            </div>

            <section class="card p-4 space-y-4">
                <h2>Choose a Gym</h2>

                <div
                    th:if="${gyms.isEmpty()}"
                    class="border rounded p-6 text-center text-muted-foreground"
                >
                    No gyms available. Please contact an administrator to add
                    gyms.
                </div>

                <div
                    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
                    th:unless="${gyms.isEmpty()}"
                >
                    <form
                        th:each="gym : ${gyms}"
                        th:action="@{/sessions}"
                        method="post"
                        class="flex flex-col items-center text-center"
                    >
                        <input
                            type="hidden"
                            name="gymId"
                            th:value="${gym.id}"
                        />
                        <button
                            type="submit"
                            class="w-32 h-32 rounded-full border-4 border-main bg-background hover:bg-main hover:border-main-foreground transition-all flex items-center justify-center text-main-foreground font-medium"
                        >
                            <span
                                class="text-sm font-semibold"
                                th:text="${gym.name.length() > 20 ? gym.name.substring(0, 20) + '...' : gym.name}"
                            >
                                Gym Name
                            </span>
                        </button>
                        <p
                            class="mt-2 text-sm text-main-foreground"
                            th:text="${gym.name}"
                        >
                            Full Gym Name
                        </p>
                    </form>
                </div>
            </section>
        </main>
    </th:block>
</th:block>
