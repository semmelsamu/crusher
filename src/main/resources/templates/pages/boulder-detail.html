<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main
            class="wrapper"
            th:with="breadcrumb=${ { {label: 'Home', url: '/'}, {label: 'Dashboard', url: '/dashboard'}, {label: 'All Boulders', url: '/boulders'}, {label: boulder.description, url: '/boulders/' + boulder.id} } }"
        >
            <div
                th:replace="~{components/breadcrumb :: breadcrumb(${breadcrumb})}"
            ></div>

            <div class="flex items-center gap-4">
                <a th:href="@{/boulders}" class="button button-square">
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header class="card flex-1 p-4 flex items-center gap-4">
                    <h1>Boulder Details</h1>

                    <span
                        th:if="${isProject}"
                        class="badge warning ml-auto flex items-center gap-3 text-lg px-4 py-5"
                    >
                        <x th:replace="~{components/icons :: star}"></x>
                        Project
                    </span>
                </header>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Card 1: Boulder Title with Color and Grade -->
                <section
                    class="card p-6 flex flex-col items-center justify-center space-y-4"
                >
                    <p
                        class="text-6xl font-bold text-accent text-center"
                        th:text="${boulder.description}"
                    >
                        Boulder Description
                    </p>

                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2">
                            <div
                                th:class="'color-badge ' + ${boulder.color.cssColorClass}"
                            ></div>
                            <span
                                class="text-sm text-muted-foreground"
                                th:text="${boulder.color.displayName}"
                            >
                                Color
                            </span>
                        </div>

                        <div class="flex items-center gap-2">
                            <span
                                class="grade-badge"
                                th:text="${boulder.grade.name}"
                            >
                                Grade
                            </span>
                            <span class="text-sm text-muted-foreground">
                                Grade
                            </span>
                        </div>
                    </div>
                </section>

                <!-- Card 2: Location -->
                <section class="card p-4 space-y-4">
                    <h2>Location</h2>

                    <div class="space-y-4">
                        <div>
                            <p class="text-sm text-muted-foreground">Gym</p>
                            <p
                                class="font-medium text-lg"
                                th:text="${boulder.sector.gym.name}"
                            >
                                Gym Name
                            </p>
                        </div>

                        <div>
                            <p class="text-sm text-muted-foreground">Sector</p>
                            <p
                                class="font-medium text-lg"
                                th:text="${boulder.sector.name}"
                            >
                                Sector Name
                            </p>
                        </div>

                        <div>
                            <p class="text-sm text-muted-foreground">Holds</p>
                            <p
                                class="font-medium text-lg"
                                th:text="${boulder.holdsCount}"
                            >
                                0
                            </p>
                        </div>
                    </div>
                </section>

                <!-- Card 3: Your Rating -->
                <section
                    class="card p-6 flex flex-col items-center justify-center space-y-4"
                >
                    <p class="text-sm font-medium text-foreground-muted">
                        Your Rating
                    </p>
                    <div class="flex gap-2">
                        <form
                            th:action="@{/boulders/{id}/rating(id=${boulder.id})}"
                            method="post"
                        >
                            <input type="hidden" name="rating" value="1" />
                            <button
                                type="submit"
                                class="star-button transition-colors duration-200"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="48"
                                    height="48"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="#000"
                                    stroke-width="1"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    th:classappend="${currentRating >= 1} ? 'color-warning' : 'color-muted'"
                                >
                                    <path
                                        d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
                                    />
                                </svg>
                            </button>
                        </form>
                        <form
                            th:action="@{/boulders/{id}/rating(id=${boulder.id})}"
                            method="post"
                        >
                            <input type="hidden" name="rating" value="2" />
                            <button
                                type="submit"
                                class="star-button transition-colors duration-200"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="48"
                                    height="48"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="#000"
                                    stroke-width="1"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    th:classappend="${currentRating >= 2} ? 'color-warning' : 'color-muted'"
                                >
                                    <path
                                        d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
                                    />
                                </svg>
                            </button>
                        </form>
                        <form
                            th:action="@{/boulders/{id}/rating(id=${boulder.id})}"
                            method="post"
                        >
                            <input type="hidden" name="rating" value="3" />
                            <button
                                type="submit"
                                class="star-button transition-colors duration-200"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="48"
                                    height="48"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="#000"
                                    stroke-width="1"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    th:classappend="${currentRating >= 3} ? 'color-warning' : 'color-muted'"
                                >
                                    <path
                                        d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
                                    />
                                </svg>
                            </button>
                        </form>
                        <form
                            th:action="@{/boulders/{id}/rating(id=${boulder.id})}"
                            method="post"
                        >
                            <input type="hidden" name="rating" value="4" />
                            <button
                                type="submit"
                                class="star-button transition-colors duration-200"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="48"
                                    height="48"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="#000"
                                    stroke-width="1"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    th:classappend="${currentRating >= 4} ? 'color-warning' : 'color-muted'"
                                >
                                    <path
                                        d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
                                    />
                                </svg>
                            </button>
                        </form>
                        <form
                            th:action="@{/boulders/{id}/rating(id=${boulder.id})}"
                            method="post"
                        >
                            <input type="hidden" name="rating" value="5" />
                            <button
                                type="submit"
                                class="star-button transition-colors duration-200"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="48"
                                    height="48"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="#000"
                                    stroke-width="1"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    th:classappend="${currentRating >= 5} ? 'color-warning' : 'color-muted'"
                                >
                                    <path
                                        d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
                                    />
                                </svg>
                            </button>
                        </form>
                    </div>
                </section>

                <!-- Card 4: Stats -->
                <section class="card p-6">
                    <div class="grid grid-cols-2 gap-6 h-full">
                        <!-- Total Tries Column -->
                        <div class="flex flex-col items-center justify-center">
                            <p
                                class="text-sm font-medium text-foreground-muted mb-2"
                            >
                                Total Tries
                            </p>
                            <p
                                class="text-6xl font-bold text-main"
                                th:text="${totalTries}"
                            >
                                0
                            </p>
                        </div>

                        <!-- Total Ascents Column -->
                        <div class="flex flex-col items-center justify-center">
                            <p
                                class="text-sm font-medium text-foreground-muted mb-2"
                            >
                                Total Ascents
                            </p>
                            <p
                                class="text-6xl font-bold text-success"
                                th:text="${ascentsCount}"
                            >
                                0
                            </p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </th:block>
</th:block>
