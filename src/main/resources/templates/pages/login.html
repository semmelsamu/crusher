<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="space-y-8 my-16">
            <div class="card space-y-4 p-4 max-w-lg mx-auto">
                <h2>Login</h2>

                <section th:if="${param.error} or ${param.logout}">
                    <p th:if="${param.error}">Invalid username or password</p>

                    <p th:if="${param.logout}">
                        You have been logged out successfully
                    </p>
                </section>

                <form th:action="@{/login}" method="post" class="space-y-4">
                    <div>
                        <label for="username" class="form-label"
                            >Username</label
                        >
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-input"
                            required
                            autofocus
                            placeholder="Enter your username"
                        />
                    </div>

                    <div>
                        <label for="password" class="form-label"
                            >Password</label
                        >
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            required
                            placeholder="Enter your password"
                        />
                    </div>

                    <button type="submit" class="btn btn-primary w-full">
                        Log In
                    </button>
                </form>
            </div>

            <div class="card space-y-4 p-4 max-w-lg mx-auto">
                <h3>Test Accounts</h3>
                <p>All accounts use password: <strong>test</strong></p>
                <dl>
                    <dt>alice</dt>
                    <dd>USER</dd>
                    <dt>bob</dt>
                    <dd>SETTER</dd>
                    <dt>klaus</dt>
                    <dd>OWNER</dd>
                    <dt>crusher</dt>
                    <dd>ADMIN</dd>
                </dl>
            </div>
        </main>
    </th:block>
</th:block>
