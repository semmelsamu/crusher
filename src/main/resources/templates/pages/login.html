<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="space-y-8 my-16">
            <div
                th:if="${param.logout}"
                class="card bg-secondary-background space-y-4 p-4 max-w-sm mx-auto text-center flex items-center gap-2 justify-center"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-check-icon lucide-check"
                >
                    <path d="M20 6 9 17l-5-5" />
                </svg>
                You have been logged out successfully
            </div>

            <div
                th:if="${param.error}"
                class="card bg-secondary-background space-y-4 p-4 max-w-sm mx-auto text-center flex items-center gap-2 justify-center"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-x-icon lucide-x"
                >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
                Invalid username or password
            </div>

            <section
                class="card bg-secondary-background space-y-4 p-4 max-w-lg mx-auto"
            >
                <h2>Login</h2>

                <form th:action="@{/login}" method="post" class="space-y-4">
                    <div>
                        <label for="username" class="form-label"
                            >Username</label
                        >
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="text-input block w-full"
                            required
                            autofocus
                            placeholder="Enter your username"
                        />
                    </div>

                    <div>
                        <label for="password" class="form-label"
                            >Password</label
                        >
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="text-input block w-full"
                            required
                            placeholder="Enter your password"
                        />
                    </div>

                    <button type="submit" class="button w-full">
                        Log In<svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-log-in-icon lucide-log-in"
                        >
                            <path d="m10 17 5-5-5-5" />
                            <path d="M15 12H3" />
                            <path
                                d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
                            />
                        </svg>
                    </button>
                </form>
            </section>

            <aside
                class="card bg-secondary-background space-y-4 p-4 max-w-lg mx-auto"
            >
                <h3>Test Accounts</h3>
                <p>All accounts use password: <strong>test</strong></p>
                <dl>
                    <dt>alice</dt>
                    <dd>USER</dd>
                    <dt>bob</dt>
                    <dd>SETTER</dd>
                    <dt>klaus</dt>
                    <dd>OWNER</dd>
                    <dt>crusher</dt>
                    <dd>ADMIN</dd>
                </dl>
            </aside>
        </main>
    </th:block>
</th:block>
