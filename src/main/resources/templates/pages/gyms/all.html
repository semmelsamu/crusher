<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main
            class="wrapper"
            th:with="breadcrumb=${ { {label: 'Home', url: '/'}, {label: 'Gyms', url: '/gyms'} } }"
        >
            <div
                th:replace="~{components/breadcrumb :: breadcrumb(${breadcrumb})}"
            ></div>

            <div class="flex items-center gap-4">
                <a th:href="@{/dashboard}" class="button button-square">
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 p-4 flex items-center justify-between"
                >
                    <h1>All Gyms</h1>
                </header>
            </div>

            <section class="card p-4 space-y-4">
                <h2>Gyms</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>City</th>
                            <th>Street</th>
                            <th>Email</th>
                            <th class="w-20">Rating</th>
                        </tr>
                    </thead>

                    <tbody th:if="${gyms.isEmpty()}">
                        <tr>
                            <td
                                colspan="6"
                                class="text-center text-muted-foreground"
                            >
                                No gyms available yet.
                            </td>
                        </tr>
                    </tbody>
                    <tbody th:unless="${gyms.isEmpty()}">
                        <tr
                            class="cursor-pointer hover:bg-main"
                            th:each="gym : ${gyms}"
                            th:onclick="|window.location.href='@{/gyms/{id}(id=${gym.id})}';|"
                        >
                            <td th:text="${gym.name}">Gym Name</td>
                            <td th:text="${gym.city}">City</td>
                            <td th:text="${gym.street}">Street</td>
                            <td th:text="${gym.email}">email@example.com</td>
                            <td>
                                <span
                                    th:if="${gymRatings.containsKey(gym.id)}"
                                    th:text="${gymRatings.get(gym.id)} + '/5'"
                                >
                                    3/5
                                </span>
                                <span
                                    th:unless="${gymRatings.containsKey(gym.id)}"
                                >
                                    -
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </th:block>
</th:block>
