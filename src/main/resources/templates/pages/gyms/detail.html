<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main
            class="wrapper"
            th:with="breadcrumb=${ { {label: 'Home', url: '/'}, {label: 'Gyms', url: '/gyms'}, {label: gym.name, url: '/gyms/' + gym.id} } }"
        >
            <div
                th:replace="~{components/breadcrumb :: breadcrumb(${breadcrumb})}"
            ></div>

            <div class="flex items-center gap-4">
                <a th:href="@{/gyms}" class="button button-square">
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header class="card flex-1 p-4 flex items-center gap-4">
                    <h1>Gym Details</h1>
                </header>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Card 1: Gym Info -->
                <section
                    class="card p-6 flex flex-col items-center justify-center space-y-4"
                >
                    <p
                        class="text-6xl font-bold text-accent text-center"
                        th:text="${gym.name}"
                    >
                        Gym Name
                    </p>

                    <div class="space-y-2 text-center">
                        <div class="flex items-center gap-2 justify-center">
                            <span
                                class="text-lg"
                                th:text="${gym.city} + ', ' + ${gym.street}"
                            >
                                City, Street
                            </span>
                        </div>

                        <div class="flex items-center gap-2 justify-center">
                            <span class="text-lg" th:text="${gym.email}">
                                email@example.com
                            </span>
                        </div>
                    </div>
                </section>

                <!-- Card 2: Your Rating -->
                <section
                    class="card p-6 flex flex-col items-center justify-center space-y-4"
                >
                    <p class="text-sm font-medium text-foreground-muted">
                        Your Rating
                    </p>
                    <div
                        th:replace="~{components/star-rating :: star-rating('/gyms/' + ${gym.id} + '/rating', ${currentRating}, ${averageRating})}"
                    ></div>
                </section>
            </div>

            <!-- Comments Section (full width) -->
            <section
                class="card p-4 space-y-4 max-w-xl mx-auto"
                xmlns:th="http://www.thymeleaf.org"
            >
                <h2>Comments</h2>

                <form
                    th:action="@{'/gyms/' + ${gym.id} + '/comments'}"
                    method="post"
                    class="comment-form w-full space-y-4"
                    x-data="{ comment: '' }"
                >
                    <div class="flex gap-3">
                        <div
                            th:replace="~{components/avatar :: avatar(${#authentication.principal.username})}"
                            class="self-start mt-3"
                        ></div>
                        <textarea
                            id="comment"
                            name="comment"
                            rows="3"
                            class="text-input w-full"
                            placeholder="Add a comment"
                            required
                            x-model="comment"
                        ></textarea>
                    </div>
                    <button
                        type="submit"
                        class="button ms-auto"
                        x-bind:disabled="comment.length === 0"
                    >
                        Comment
                    </button>
                </form>

                <div
                    th:if="${comments == null || comments.isEmpty()}"
                    class="text-sm text-muted-foreground text-center py-8"
                >
                    No comments yet. Be the first to comment!
                </div>

                <div
                    th:unless="${comments == null || comments.isEmpty()}"
                    class="space-y-6"
                >
                    <div th:each="comment : ${comments}" class="flex gap-4">
                        <div
                            th:replace="~{components/avatar :: avatar(${comment.user.name})}"
                        ></div>
                        <div class="flex-1">
                            <p class="text-sm flex items-center gap-2">
                                <strong th:text="${comment.user.name}">
                                    Username
                                </strong>
                                <time
                                    class="text-foreground-muted"
                                    th:text="${#temporals.format(comment.createdAt, 'dd.MM.yyyy HH:mm')}"
                                >
                                    01.01.2024 12:00
                                </time>
                                <span
                                    th:if="${comment.user.name == #authentication.principal.username}"
                                    th:onclick="|openDialog('delete-comment-dialog-${comment.id}')|"
                                    style="
                                        cursor: pointer;
                                        color: var(--color-foreground-muted);
                                        transition: color 0.2s;
                                        display: inline-flex;
                                        align-items: center;
                                        width: 12px;
                                        height: 12px;
                                    "
                                    onmouseover="
                                        this.style.color = 'var(--color-error)'
                                    "
                                    onmouseout="
                                        this.style.color =
                                            'var(--color-foreground-muted)'
                                    "
                                >
                                    <x
                                        th:replace="~{components/icons :: trash-2-small}"
                                    ></x>
                                </span>
                            </p>
                            <p th:text="${comment.comment}">
                                Comment text goes here
                            </p>
                        </div>

                        <!-- Delete confirmation dialog -->
                        <dialog
                            th:if="${comment.user.name == #authentication.principal.username}"
                            th:id="|delete-comment-dialog-${comment.id}|"
                            class="dialog space-y-4"
                            closedby="any"
                        >
                            <h3>Confirm Deletion</h3>
                            <p>Are you sure you want to delete this comment?</p>
                            <div class="flex justify-end gap-4">
                                <button
                                    class="button"
                                    th:onclick="|closeDialog('delete-comment-dialog-${comment.id}')|"
                                >
                                    Cancel
                                </button>
                                <form
                                    th:action="@{/gyms/__${gym.id}__/comments/__${comment.id}__}"
                                    method="post"
                                    class="inline"
                                >
                                    <input
                                        type="hidden"
                                        name="_method"
                                        value="delete"
                                    />
                                    <button
                                        autofocus
                                        type="submit"
                                        class="button danger"
                                    >
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </dialog>
                    </div>
                </div>
            </section>
        </main>
    </th:block>
</th:block>
