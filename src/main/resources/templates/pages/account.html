<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="wrapper">
            <div class="flex items-center gap-4">
                <a
                    th:href="${isAdminEdit ? '/admin/users' : '/dashboard'}"
                    class="button button-square"
                >
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>
                <header
                    class="card flex-1 p-card-inner flex items-center justify-between"
                >
                    <div>
                        <h1
                            th:text="${isAdminEdit ? 'Edit User' : 'Account settings'}"
                        >
                            Account settings
                        </h1>
                        <p
                            class="text-foreground-muted"
                            th:text="${isAdminEdit ? 'Update user details and role.' : 'Update your profile details.'}"
                        >
                            Update your profile details.
                        </p>
                    </div>
                    <button
                        type="button"
                        class="button danger button-square"
                        aria-label="Delete account"
                        onclick="openDialog('delete-account-dialog')"
                        th:if="${!isAdminEdit}"
                    >
                        <x th:replace="~{components/icons :: trash-2}"></x>
                    </button>
                </header>
            </div>

            <section class="card p-card-inner max-w-md mx-auto">
                <form
                    th:action="${isAdminEdit ? '/admin/users/' + currentUser.id : '/account'}"
                    method="post"
                    class="space-y-4"
                    th:if="${currentUser != null}"
                >
                    <input type="hidden" name="_method" value="put" />
                    <input
                        type="hidden"
                        name="returnTo"
                        th:value="${returnTo}"
                        th:if="${!isAdminEdit}"
                    />
                    <div class="space-y-2">
                        <label for="account-username" class="form-label"
                            >Username</label
                        >
                        <input
                            type="text"
                            id="account-username"
                            name="username"
                            class="text-input block w-full"
                            required
                            th:value="${currentUser.name}"
                        />
                    </div>
                    <div class="space-y-2">
                        <label for="account-email" class="form-label"
                            >Email</label
                        >
                        <input
                            type="email"
                            id="account-email"
                            name="email"
                            class="text-input block w-full"
                            required
                            th:value="${currentUser.email}"
                        />
                    </div>
                    <div class="space-y-2" th:if="${isAdminEdit}">
                        <label for="account-role" class="form-label"
                            >Role</label
                        >
                        <select
                            id="account-role"
                            name="role"
                            class="text-input block w-full"
                            required
                            th:value="${currentUser.role}"
                        >
                            <option
                                value="USER"
                                th:selected="${currentUser.role == 'USER'}"
                            >
                                USER
                            </option>
                            <option
                                value="ADMIN"
                                th:selected="${currentUser.role == 'ADMIN'}"
                            >
                                ADMIN
                            </option>
                            <option
                                value="OWNER"
                                th:selected="${currentUser.role == 'OWNER'}"
                            >
                                OWNER
                            </option>
                            <option
                                value="SETTER"
                                th:selected="${currentUser.role == 'SETTER'}"
                            >
                                SETTER
                            </option>
                        </select>
                    </div>
                    <button type="submit" class="button primary">
                        <x th:replace="~{components/icons :: check}"></x>
                        Save changes
                    </button>
                </form>
            </section>

            <dialog
                id="delete-account-dialog"
                class="dialog space-y-4"
                closedby="any"
                th:if="${!isAdminEdit}"
            >
                <h3>Confirm deletion</h3>
                <p>
                    Are you sure you want to delete your account? Your gym
                    activity will remain.
                </p>
                <div class="flex justify-end gap-4">
                    <button
                        class="button"
                        onclick="closeDialog('delete-account-dialog')"
                    >
                        Cancel
                    </button>
                    <form th:action="@{/account}" method="post" class="inline">
                        <input type="hidden" name="_method" value="delete" />
                        <button autofocus type="submit" class="button danger">
                            Delete
                        </button>
                    </form>
                </div>
            </dialog>
        </main>
    </th:block>
</th:block>
