<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="wrapper">
            <div
                th:replace="~{components/breadcrumb :: breadcrumb(${breadcrumb})}"
            ></div>

            <div class="flex items-center gap-4">
                <a th:href="@{/dashboard}" class="button button-square">
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 p-4 flex items-center justify-between"
                >
                    <h1>All Boulders</h1>
                </header>
            </div>

            <section class="card p-4 space-y-4">
                <h2>Filter Boulders</h2>

                <form
                    id="filter-form"
                    th:action="@{/boulders}"
                    method="get"
                    class="grid grid-cols-1 md:grid-cols-3 gap-4"
                >
                    <div class="space-y-2">
                        <label class="block font-medium">Gym</label>
                        <select
                            id="gym-select"
                            name="gymId"
                            class="text-input w-full"
                        >
                            <option
                                th:each="gym : ${gyms}"
                                th:value="${gym.id}"
                                th:text="${gym.name}"
                                th:selected="${gym.id == selectedGymId}"
                            >
                                Gym
                            </option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="block font-medium">Sector</label>
                        <select name="sectorId" class="text-input w-full">
                            <option value="">All Sectors</option>
                            <option
                                th:each="sector : ${sectors}"
                                th:value="${sector.id}"
                                th:text="${sector.name}"
                                th:selected="${sector.id == selectedSectorId}"
                            >
                                Sector
                            </option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="block font-medium">Grades</label>
                        <div
                            class="border rounded-base p-2 max-h-40 overflow-y-auto bg-background"
                        >
                            <div
                                th:if="${grades.isEmpty()}"
                                class="text-muted-foreground text-sm"
                            >
                                No grades available
                            </div>
                            <div
                                th:each="grade : ${grades}"
                                class="flex items-center gap-2 py-1"
                            >
                                <input
                                    type="checkbox"
                                    name="gradeIds"
                                    th:value="${grade.id}"
                                    th:id="'grade-' + ${grade.id}"
                                    th:checked="${selectedGradeIds.contains(grade.id)}"
                                    class="cursor-pointer"
                                />
                                <label
                                    th:for="'grade-' + ${grade.id}"
                                    th:text="${grade.name}"
                                    class="cursor-pointer"
                                >
                                    Grade
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block font-medium">Projects</label>
                        <div class="flex items-center gap-2 h-full">
                            <input
                                type="checkbox"
                                id="project-only"
                                name="projectOnly"
                                class="cursor-pointer"
                                th:checked="${projectOnly}"
                            />
                            <label for="project-only" class="cursor-pointer">
                                Show projects only
                            </label>
                        </div>
                    </div>

                    <div class="md:col-span-3 flex gap-2">
                        <button type="submit" class="button button-primary">
                            Apply Filters
                        </button>
                        <a th:href="@{/boulders}" class="button">
                            Clear Filters
                        </a>
                    </div>
                </form>
            </section>

            <section class="card p-4 space-y-4">
                <h2>Results</h2>

                <table class="table w-full">
                    <thead>
                        <tr>
                            <th class="w-20">Color</th>
                            <th class="w-20">Grade</th>
                            <th>Description</th>
                            <th>Sector</th>
                            <th>Gym</th>
                            <th class="w-16 text-right">Project</th>
                        </tr>
                    </thead>

                    <tbody th:if="${boulders.isEmpty()}">
                        <tr>
                            <td
                                colspan="5"
                                class="text-center text-muted-foreground"
                            >
                                No boulders available yet.
                            </td>
                        </tr>
                    </tbody>
                    <tbody th:unless="${boulders.isEmpty()}">
                        <tr th:each="boulder : ${boulders}">
                            <td>
                                <div
                                    th:class="'color-badge ' + ${boulder.color.cssColorClass}"
                                ></div>
                            </td>
                            <td>
                                <span
                                    class="grade-badge"
                                    th:text="${boulder.grade.name}"
                                >
                                    Grade
                                </span>
                            </td>
                            <td>
                                <span th:text="${boulder.description}">
                                    Description
                                </span>
                            </td>
                            <td>
                                <span th:text="${boulder.sector.name}">
                                    Sector
                                </span>
                            </td>
                            <td>
                                <span th:text="${boulder.sector.gym.name}">
                                    Gym
                                </span>
                            </td>
                            <td class="text-right">
                                <div class="flex justify-end">
                                    <form
                                        th:if="${projectBoulderIds.contains(boulder.id)}"
                                        th:action="@{/boulders/{boulderId}/project(boulderId=${boulder.id})}"
                                        method="post"
                                        class="inline"
                                    >
                                        <input
                                            type="hidden"
                                            name="_method"
                                            value="delete"
                                        />
                                        <input
                                            th:if="${selectedGymId != null}"
                                            type="hidden"
                                            name="gymId"
                                            th:value="${selectedGymId}"
                                        />
                                        <input
                                            th:if="${selectedSectorId != null}"
                                            type="hidden"
                                            name="sectorId"
                                            th:value="${selectedSectorId}"
                                        />
                                        <input
                                            th:if="${selectedGradeIds != null}"
                                            th:each="gradeId : ${selectedGradeIds}"
                                            type="hidden"
                                            name="gradeIds"
                                            th:value="${gradeId}"
                                        />
                                        <input
                                            th:if="${projectOnly}"
                                            type="hidden"
                                            name="projectOnly"
                                            value="true"
                                        />
                                        <button
                                            type="submit"
                                            class="button button-primary button-square text-white"
                                            aria-label="Remove from projects"
                                            aria-pressed="true"
                                        >
                                            <x
                                                th:replace="~{components/icons :: star}"
                                            ></x>
                                        </button>
                                    </form>
                                    <form
                                        th:unless="${projectBoulderIds.contains(boulder.id)}"
                                        th:action="@{/boulders/{boulderId}/project(boulderId=${boulder.id})}"
                                        method="post"
                                        class="inline"
                                    >
                                        <input
                                            th:if="${selectedGymId != null}"
                                            type="hidden"
                                            name="gymId"
                                            th:value="${selectedGymId}"
                                        />
                                        <input
                                            th:if="${selectedSectorId != null}"
                                            type="hidden"
                                            name="sectorId"
                                            th:value="${selectedSectorId}"
                                        />
                                        <input
                                            th:if="${selectedGradeIds != null}"
                                            th:each="gradeId : ${selectedGradeIds}"
                                            type="hidden"
                                            name="gradeIds"
                                            th:value="${gradeId}"
                                        />
                                        <input
                                            th:if="${projectOnly}"
                                            type="hidden"
                                            name="projectOnly"
                                            value="true"
                                        />
                                        <button
                                            type="submit"
                                            class="button button-primary button-square text-white"
                                            aria-label="Add to projects"
                                            aria-pressed="false"
                                        >
                                            <x
                                                th:replace="~{components/icons :: star-off}"
                                            ></x>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </th:block>
</th:block>
