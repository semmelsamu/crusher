<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="wrapper">
            <div class="flex items-center gap-4">
                <a
                    th:href="@{/admin/gyms/{gymId}/sectors/{sectorId}(gymId=${gym.id}, sectorId=${sector.id})}"
                    class="button button-square"
                >
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 flex items-center justify-between p-4"
                >
                    <h1>Create New Boulder</h1>
                </header>
            </div>

            <section class="card p-4 max-w-md mx-auto">
                <th:block
                    th:replace="~{components/cu-forms/boulder :: boulder(
                        @{/admin/gyms/{gymId}/sectors/{sectorId}/boulders(gymId=${gym.id}, sectorId=${sector.id})},
                        ${boulder},
                        ${gym},
                        ${sector},
                        ${availableColors},
                        ${availableGrades}
                    )}"
                ></th:block>
            </section>
        </main>
    </th:block>
</th:block>
