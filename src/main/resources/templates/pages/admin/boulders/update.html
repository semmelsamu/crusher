<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="wrapper">
            <div class="flex items-center gap-4">
                <a
                    th:href="@{/admin/gyms/{gymId}/sectors/{sectorId}(gymId=${gym.id}, sectorId=${sector.id})}"
                    class="button button-square"
                >
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 p-4 flex items-center justify-between"
                >
                    <h1>Edit Boulder</h1>
                </header>
            </div>

            <section class="card p-4 max-w-md mx-auto">
                <th:block
                    th:replace="~{components/cu-forms/boulder :: boulder(
                        @{/admin/gyms/{gymId}/sectors/{sectorId}/boulders/{boulderId}(gymId=${gym.id}, sectorId=${sector.id}, boulderId=${boulder.id})},
                        ${boulder},
                        ${gym},
                        ${sector},
                        ${availableColors},
                        ${availableGrades}
                    )}"
                ></th:block>
            </section>

            <div class="max-w-md mx-auto mt-4">
                <form
                    th:action="@{/admin/gyms/{gymId}/sectors/{sectorId}/boulders/{boulderId}(gymId=${gym.id}, sectorId=${sector.id}, boulderId=${boulder.id})}"
                    method="post"
                >
                    <input type="hidden" name="_method" value="delete" />
                    <button
                        type="submit"
                        class="px-3 py-2 text-white bg-red-600 rounded"
                    >
                        Delete Boulder
                    </button>
                </form>
            </div>
        </main>
    </th:block>
</th:block>
