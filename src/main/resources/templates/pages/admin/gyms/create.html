<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main
            class="wrapper"
            th:with="breadcrumb=${ { {label: 'Home', url: '/'}, {label: 'Admin Panel', url: '/admin/gyms'}, {label: 'Gyms', url: '/admin/gyms'}, {label: 'New Gym', url: ''} } }"
        >
            <div
                th:replace="~{components/breadcrumb :: breadcrumb(${breadcrumb})}"
            ></div>

            <div class="flex items-center gap-4">
                <a th:href="@{/admin/gyms}" class="button button-square">
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 flex items-center justify-between p-card-inner"
                >
                    <h1>Create New Gym</h1>
                </header>
            </div>

            <section class="card p-card-inner max-w-md mx-auto">
                <th:block
                    th:replace="~{components/cu-forms/gym :: gym(
                    @{/admin/gyms},
                    ${gym}
                )}"
                ></th:block>
            </section>
        </main>
    </th:block>
</th:block>
