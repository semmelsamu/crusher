<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="wrapper">
            <div class="flex items-center gap-4">
                <a
                    th:href="@{/admin/gyms/{gymId}/sectors/{sectorId}(gymId=${gym.id}, sectorId=${sector.id})}"
                    class="button button-square"
                >
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 flex items-center justify-between p-4"
                >
                    <div>
                        <p
                            class="text-sm text-muted-foreground"
                            th:text="${gym.name}"
                        >
                            Gym Name
                        </p>
                        <h1>Edit Sector</h1>
                    </div>
                </header>
            </div>

            <section class="card p-4 max-w-md mx-auto">
                <th:block
                    th:replace="~{components/cu-forms/sector :: sector(
                    @{/admin/gyms/{gymId}/sectors/{sectorId}(gymId=${gym.id}, sectorId=${sector.id})},
                    ${sector},
                    ${gym}
                )}"
                ></th:block>
            </section>
        </main>
    </th:block>
</th:block>
