<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <div class="my-12">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl">Gyms</h2>
                <div class="flex items-center gap-4">
                    <a th:href="@{/admin/gyms/new}" class="px-4 py-2 bg-blue-600 text-white rounded">
                        Create Gym
                    </a>
                    <a href="/" class="px-3 py-2 border rounded">Back</a>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div th:each="gym : ${gyms}" class="border rounded p-4 hover:shadow-lg transition-shadow">
                    <a th:href="@{/admin/gyms/{id}(id=${gym.id})}" class="block">
                        <h3 class="text-xl font-semibold mb-2" th:text="${gym.name}">Gym Name</h3>
                        <p class="text-sm text-gray-600" th:text="${gym.street}">Street</p>
                        <p class="text-sm text-gray-600" th:text="${gym.city}">City</p>
                        <p class="text-sm text-gray-600 mt-2" th:text="${gym.email}">Email</p>
                    </a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(gyms)}" class="text-center text-gray-600 py-12">
                <p>No gyms found. Create your first gym to get started.</p>
            </div>
        </div>
    </th:block>
</th:block>
