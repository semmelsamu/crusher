<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <div class="my-12">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <p
                        class="text-sm text-gray-600"
                        th:text="${gym.name} + ' / ' + ${sector.name}"
                    >
                        Gym Name / Sector Name
                    </p>
                    <h2
                        class="text-2xl font-semibold"
                        th:text="${boulder.id} != null ? ${boulder.description} : 'New Boulder'"
                    >
                        Boulder Title
                    </h2>
                </div>
                <a
                    th:href="@{/admin/gyms/{gymId}/sectors/{sectorId}(gymId=${gym.id}, sectorId=${sector.id})}"
                    class="px-3 py-2 border rounded"
                    >Back to Boulders</a
                >
            </div>

            <form
                th:action="${boulder.id} != null ?
                        @{/admin/gyms/{gymId}/sectors/{sectorId}/boulders/{boulderId}(gymId=${gym.id}, sectorId=${sector.id}, boulderId=${boulder.id})} :
                        @{/admin/gyms/{gymId}/sectors/{sectorId}/boulders(gymId=${gym.id}, sectorId=${sector.id})}"
                th:object="${boulder}"
                method="post"
                class="space-y-6"
            >
                <input
                    type="hidden"
                    name="_method"
                    th:value="${boulder.id} != null ? 'put' : 'post'"
                />

                <div>
                    <label class="block font-medium mb-2">Description</label>
                    <input
                        th:field="*{description}"
                        class="border w-full p-2 rounded"
                        placeholder="e.g., Links hinten"
                    />
                    <p
                        th:if="${#fields.hasErrors('description')}"
                        th:errors="*{description}"
                        class="text-red-600 text-sm mt-1"
                    ></p>
                </div>

                <div>
                    <label class="block font-medium mb-2">Color</label>
                    <select
                        th:field="*{color}"
                        class="border w-full p-2 rounded"
                    >
                        <option
                            th:each="colorOption : ${availableColors}"
                            th:value="${colorOption}"
                            th:text="${colorOption.displayName}"
                        >
                            Color
                        </option>
                    </select>
                    <p
                        th:if="${#fields.hasErrors('color')}"
                        th:errors="*{color}"
                        class="text-red-600 text-sm mt-1"
                    ></p>
                </div>

                <div>
                    <label class="block font-medium mb-2">Grade</label>
                    <select
                        th:field="*{grade.id}"
                        class="border w-full p-2 rounded"
                    >
                        <option
                            th:each="gradeOption : ${availableGrades}"
                            th:value="${gradeOption.id}"
                            th:text="${gradeOption.name}"
                        >
                            Grade
                        </option>
                    </select>
                    <p
                        th:if="${#fields.hasErrors('grade')}"
                        th:errors="*{grade}"
                        class="text-red-600 text-sm mt-1"
                    ></p>
                </div>

                <div class="flex items-center space-x-3">
                    <button
                        type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded"
                    >
                        Save
                    </button>
                    <a
                        th:if="${boulder.id != null}"
                        th:href="@{/admin/gyms/{gymId}/sectors/{sectorId}(gymId=${gym.id}, sectorId=${sector.id})}"
                        class="px-3 py-2 border rounded"
                    >
                        Cancel
                    </a>
                </div>
            </form>

            <div class="mt-8" th:if="${boulder.id != null}">
                <form
                    th:action="@{/admin/gyms/{gymId}/sectors/{sectorId}/boulders/{boulderId}(gymId=${gym.id}, sectorId=${sector.id}, boulderId=${boulder.id})}"
                    method="post"
                >
                    <input type="hidden" name="_method" value="delete" />
                    <button
                        type="submit"
                        class="px-3 py-2 text-white bg-red-600 rounded"
                    >
                        Delete Boulder
                    </button>
                </form>
            </div>
        </div>
    </th:block>
</th:block>
