<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main
            class="wrapper"
            th:with="breadcrumb=${ { {label: 'Home', url: '/'}, {label: 'Sessions', url: '/sessions'}, {label: 'Session', url: '/sessions/' + currentSession.id}, {label: 'Record Go', url: '/sessions/' + currentSession.id + '/goes/create'}, {label: 'Select Result', url: ''} } }"
        >
            <div
                th:replace="~{components/breadcrumb :: breadcrumb(${breadcrumb})}"
            ></div>

            <div class="flex items-center gap-4">
                <a
                    th:href="@{/sessions/{sessionId}/goes/create(sessionId=${currentSession.id})}"
                    class="button button-square"
                >
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 flex items-center justify-between p-4"
                >
                    <h1>Result</h1>
                </header>
            </div>

            <section class="card p-4 max-w-md mx-auto space-y-6">
                <th:block
                    th:replace="~{components/cu-forms/go :: go(
                    @{/sessions/{sessionId}/goes(sessionId=${currentSession.id})},
                    ${go},
                    ${boulder},
                    ${true},
                    ${createAnother},
                    ${trackProgress}
                )}"
                ></th:block>
            </section>
        </main>
    </th:block>
</th:block>
