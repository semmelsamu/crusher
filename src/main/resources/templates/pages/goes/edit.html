<th:block
    layout:decorate="~{layouts/main}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="content">
        <main class="wrapper">
            <div
                th:replace="~{components/breadcrumb :: breadcrumb(${breadcrumb})}"
            ></div>

            <div class="flex items-center gap-4">
                <a
                    th:href="@{/sessions/{sessionId}(sessionId=${currentSession.id})}"
                    class="button button-square"
                >
                    <x th:replace="~{components/icons :: arrow-big-left}"></x>
                </a>

                <header
                    class="card flex-1 flex items-center justify-between p-4"
                >
                    <h1>Edit Go</h1>
                </header>
            </div>

            <section class="card p-4 max-w-md mx-auto space-y-6">
                <form
                    th:action="@{/sessions/{sessionId}/goes/{goId}(sessionId=${currentSession.id}, goId=${go.id})}"
                    method="post"
                    th:object="${go}"
                >
                    <input type="hidden" name="_method" value="put" />
                    <input type="hidden" th:field="*{boulder.id}" />
                    <input type="hidden" th:field="*{session.id}" />

                    <div class="space-y-4">
                        <div class="text-lg font-medium">
                            <p>
                                Edit Result for
                                <strong th:text="${boulder.description}"
                                    >Boulder</strong
                                >
                            </p>
                            <p class="text-sm text-muted-foreground">
                                Grade
                                <span th:text="${boulder.grade.name}">1</span>
                            </p>
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <label class="cursor-pointer h-full">
                                <input
                                    type="radio"
                                    th:field="*{result}"
                                    value="FINISHED"
                                    class="peer sr-only"
                                    required
                                />
                                <div
                                    class="border-2 rounded-base shadow-base p-4 text-center font-medium bg-success text-main-foreground h-full flex items-center justify-center transition-all peer-checked:translate-y-1 peer-checked:shadow-none"
                                >
                                    Finished
                                </div>
                            </label>

                            <label class="cursor-pointer h-full">
                                <input
                                    type="radio"
                                    th:field="*{result}"
                                    value="CLOSE_TRY"
                                    class="peer sr-only"
                                    required
                                />
                                <div
                                    class="border-2 rounded-base shadow-base p-4 text-center font-medium bg-warning text-main-foreground h-full flex items-center justify-center transition-all peer-checked:translate-y-1 peer-checked:shadow-none"
                                >
                                    Close try
                                </div>
                            </label>

                            <label class="cursor-pointer h-full">
                                <input
                                    type="radio"
                                    th:field="*{result}"
                                    value="DID_NOT_FINISH"
                                    class="peer sr-only"
                                    required
                                />
                                <div
                                    class="border-2 rounded-base shadow-base p-4 text-center font-medium bg-error text-main-foreground h-full flex items-center justify-center transition-all peer-checked:translate-y-1 peer-checked:shadow-none"
                                >
                                    Did not finish
                                </div>
                            </label>
                        </div>

                        <div
                            th:if="${#fields.hasErrors('result')}"
                            class="text-error text-sm"
                        >
                            <p th:errors="*{result}">Error</p>
                        </div>
                    </div>

                    <div
                        class="space-y-3"
                        data-progress-wrapper
                        th:if="${boulder.holdsCount != null}"
                    >
                        <div class="flex items-center gap-3">
                            <label class="switch">
                                <input
                                    type="checkbox"
                                    name="trackProgress"
                                    value="true"
                                    data-progress-toggle
                                    th:checked="${go.progressedHold != null}"
                                />
                                <span class="switch-thumb"></span>
                            </label>
                            <div>
                                <p class="font-medium">Track progress</p>
                                <p class="text-sm text-muted-foreground">
                                    Record the highest hold you reached
                                </p>
                            </div>
                        </div>

                        <div
                            class="space-y-2 border-2 rounded-base p-3"
                            data-progress-container
                            th:attr="data-disabled=${go.progressedHold == null}"
                        >
                            <div
                                class="flex items-center justify-between text-sm text-muted-foreground"
                            >
                                <span>Reached hold</span>
                                <span class="font-medium">
                                    <span
                                        data-progress-value
                                        th:text="${go.progressedHold != null ? go.progressedHold : 0}"
                                        >0</span
                                    >
                                    /
                                    <span th:text="${boulder.holdsCount}"
                                        >0</span
                                    >
                                </span>
                            </div>

                            <input
                                type="range"
                                min="0"
                                th:max="${boulder.holdsCount}"
                                step="1"
                                th:field="*{progressedHold}"
                                class="w-full"
                                data-progress-input
                                th:disabled="${go.progressedHold == null}"
                            />
                            <p class="text-sm text-muted-foreground">
                                Drag to the highest hold you managed on this go
                                (0 means the start).
                            </p>
                            <div
                                th:if="${#fields.hasErrors('progressedHold')}"
                                class="text-error text-sm"
                            >
                                <p th:errors="*{progressedHold}">Error</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end mt-6">
                        <button type="submit" class="button button-success">
                            <x th:replace="~{components/icons :: check}"></x>
                            Save
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </th:block>
</th:block>
