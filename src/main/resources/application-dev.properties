spring.thymeleaf.cache=false
# Read templates directly from the source folder for instant reloads
spring.thymeleaf.prefix=file:src/main/resources/templates/

# Serve static assets from source to avoid rebuilding for CSS/JS changes
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.chain.cache=false

# DevTools live reload + restart remain enabled
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
