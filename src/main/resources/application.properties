spring.application.name=crusher


# database
spring.datasource.url=jdbc:h2:mem:app
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Development settings - disable caching for hot reload
spring.thymeleaf.cache=false
spring.web.resources.chain.cache=false

# Optional: DevTools settings for better hot reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Error page configuration
server.error.include-stacktrace=NEVER

# file uploads
app.uploads.base-dir=uploads
app.uploads.sectors-dir=${app.uploads.base-dir}/sectors
app.uploads.max-size=5MB
spring.servlet.multipart.max-file-size=${app.uploads.max-size}
spring.servlet.multipart.max-request-size=${app.uploads.max-size}
server.error.include-message=ALWAYS
server.error.include-binding-errors=NEVER
server.error.path=/error
server.error.whitelabel.enabled=false

# Weather API Configuration
weather.api.geocoding.url=https://geocoding-api.open-meteo.com/v1/search
weather.api.forecast.url=https://api.open-meteo.com/v1/forecast
weather.api.timeout=5000

# Crowd Level Scraping Configuration
crowdlevel.timeout=3000
crowdlevel.js-wait=1500
