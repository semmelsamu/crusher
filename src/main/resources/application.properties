spring.application.name=crusher


# database
spring.datasource.url=jdbc:h2:mem:app
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Development settings - disable caching for hot reload
spring.thymeleaf.cache=false
spring.web.resources.chain.cache=false

# Optional: DevTools settings for better hot reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Do not expose stacktraces on error responses by default (override in dev profile)
server.error.include-stacktrace=NEVER

# file uploads
app.uploads.base-dir=uploads
app.uploads.sectors-dir=${app.uploads.base-dir}/sectors
app.uploads.max-size=5MB
spring.servlet.multipart.max-file-size=${app.uploads.max-size}
spring.servlet.multipart.max-request-size=${app.uploads.max-size}
